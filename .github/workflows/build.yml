name: Build

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows amd64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: go build -trimpath -ldflags "-s -w" -o dist/windows-port-forwarding.exe .

      - name: Stage runtime assets
        shell: pwsh
        run: Copy-Item -Path templates -Destination dist/templates -Recurse -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-port-forwarding-windows-amd64
          path: dist/
          if-no-files-found: error